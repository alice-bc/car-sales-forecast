
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Sales Forecast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0 15px;
        }
        button {
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Car Sales Forecast</h1>
    <p>Enter sales for the previous 6 months, from oldest to newest.</p>

    <form id="salesForm">
        <div id="inputs"></div>
        <button type="submit">Predict Next Month</button>
    </form>

    <p id="result"></p>

    <script>
        // Create six input fields
        const inputsDiv = document.getElementById("inputs");

        for (let i = 1; i <= 6; i++) {
            inputsDiv.innerHTML += `
                <label>Month ${i}</label>
                <input type="number"
                       id="month${i}"
                       min="0"
                       step="1"
                       required>
            `;
        }

        // Send inputs to FastAPI
        document.getElementById("salesForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const sales = [];

                for (let i = 1; i <= 6; i++) {
                    sales.push(
                        Number(document.getElementById(`month${i}`).value)
                    );
                }

                const result = document.getElementById("result");
                result.textContent = "Predicting...";

                try {
                    const response = await fetch("/predict", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ sales: sales })
                    });

                    if (!response.ok) {
                        throw new Error("Prediction failed");
                    }

                    const data = await response.json();

                    result.textContent =
                        "Predicted Next Month Sales: " +
                        Math.round(data.predicted_sales).toLocaleString();

                } catch (error) {
                    result.textContent =
                        "Error: Could not generate prediction.";
                }
            });
    </script>
</body>
</html>
